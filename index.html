<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GB Cam Formatter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
  :root {
    --gb-bg: #8bac0f;
    --gb-dark: #0f380f;
    --gb-mid: #306230;
    --gb-light: #9bbc0f;
    --gb-pale: #c0d68f;
    --screen-bg: #9bbc0f;
    --scanline: rgba(15, 56, 15, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Press Start 2P', monospace;
    background: var(--gb-bg);
    color: var(--gb-dark);
    font-size: 12px;
    line-height: 1.6;
  }

  h1 {
    text-align: center;
    font-size: 16px;
    margin: 20px 0 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 15px;
  }

  .panel {
    background: var(--gb-light);
    border: 3px solid var(--gb-dark);
    padding: 15px;
    margin-bottom: 15px;
    position: relative;
  }

  .panel-title {
    background: var(--gb-dark);
    color: var(--gb-light);
    padding: 6px 10px;
    margin: -15px -15px 12px -15px;
    font-size: 10px;
    text-transform: uppercase;
  }

  .drop-zone {
    border: 3px dashed var(--gb-dark);
    padding: 30px;
    text-align: center;
    background: var(--gb-pale);
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .drop-zone-text {
    width: 100%;
  }
  .drop-zone:hover, .drop-zone.dragover {
    background: var(--gb-light);
  }
  .drop-zone input[type="file"] { display: none; }
  .drop-zone .loader-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(139, 172, 15, 0.9);
    margin: 0;
    padding: 0;
  }

  .row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .col { flex: 1; min-width: 200px; }

  label {
    display: block;
    margin-bottom: 5px;
    font-size: 10px;
  }

  input[type="datetime-local"],
  input[type="number"],
  input[type="text"] {
    width: 100%;
    padding: 8px;
    border: 2px solid var(--gb-dark);
    background: var(--gb-pale);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--gb-dark);
    outline: none;
  }
  input[type="datetime-local"]:focus,
  input[type="number"]:focus,
  input[type="text"]:focus {
    background: var(--gb-light);
  }

  .field-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .field-row label {
    min-width: 70px;
    margin-bottom: 0;
  }
  .field-row input[type="number"] {
    width: 60px;
  }

  .btn {
    display: inline-block;
    padding: 10px 16px;
    background: var(--gb-dark);
    color: var(--gb-light);
    border: 2px solid var(--gb-dark);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    margin-top: 10px;
  }
  .btn:hover {
    background: var(--gb-mid);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .delete-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: #8b0000;
    color: #fff;
    border: 3px solid #5c0000;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
    text-align: center;
    position: relative;
    overflow: hidden;
    margin-top: 12px;
    user-select: none;
    -webkit-user-select: none;
  }
  .delete-btn:hover {
    background: #a50000;
  }
  .delete-btn.active {
    background: #5c0000;
  }
  .delete-progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: rgba(255, 255, 255, 0.25);
    width: 0%;
    transition: width 0.05s linear;
    pointer-events: none;
  }

  .center-actions {
    text-align: center;
  }

  .preview-wrap {
    display: flex;
    gap: 15px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .trim-controls {
    flex: 0 0 auto;
    min-width: 240px;
    align-self: flex-start;
  }

  .preview-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 200px;
    max-width: 320px;
  }

  .preview-box {
    position: relative;
    display: block;
    border: 2px solid var(--gb-dark);
    background: #000;
    max-width: 100%;
    overflow: hidden;
    align-self: flex-end;
  }
  .preview-box img, .preview-box canvas {
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
  }

  .image-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .thumb {
    background: var(--gb-dark);
    padding: 4px;
    text-align: center;
    font-size: 8px;
    color: var(--gb-light);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .thumb img {
    width: 100%;
    aspect-ratio: 128 / 112;
    object-fit: contain;
    display: block;
    image-rendering: pixelated;
    background: #000;
  }

  .status {
    margin-top: 8px;
    font-size: 10px;
    color: var(--gb-mid);
  }
  #previewStatus {
    text-align: right;
    align-self: flex-end;
  }

  .loader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    padding: 15px;
  }
  .loader-gif {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
  }
  .loader-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gb-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }

  .progress-wrap {
    width: 100%;
    height: 14px;
    background: var(--gb-pale);
    border: 2px solid var(--gb-dark);
    margin-top: 10px;
    display: none;
  }
  .progress-bar {
    height: 100%;
    background: var(--gb-dark);
    width: 0%;
    transition: width 0.2s;
  }

  .hidden { display: none !important; }

  .panel-title-toggle {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title-toggle::after {
    content: "▼";
    font-size: 10px;
    transition: transform 0.2s;
  }
  .panel-title-toggle.collapsed::after {
    content: "▶";
  }

  .teaser-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin-top: 10px;
  }
  .teaser-thumbs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .teaser-thumbs .thumb {
    flex: 0 0 100px;
    cursor: pointer;
    background: var(--gb-dark);
    padding: 3px;
    transition: transform 0.15s;
  }
  .teaser-thumbs .thumb:hover {
    transform: scale(1.05);
  }
  .teaser-thumbs .thumb img {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
  }
  .show-all-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--gb-dark);
    color: var(--gb-light);
    border: 2px solid var(--gb-dark);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .show-all-btn:hover {
    background: var(--gb-mid);
  }

  .lightbox-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(15, 56, 15, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }
  .lightbox-content {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lightbox-content img {
    max-width: 100%;
    max-height: 80vh;
    image-rendering: pixelated;
    border: 3px solid var(--gb-light);
    background: #000;
  }
  .lightbox-caption {
    margin-top: 10px;
    color: var(--gb-light);
    font-size: 9px;
    text-align: center;
  }
  .lightbox-close,
  .lightbox-prev,
  .lightbox-next {
    position: absolute;
    background: var(--gb-dark);
    color: var(--gb-light);
    border: 2px solid var(--gb-light);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    cursor: pointer;
    padding: 6px 10px;
    line-height: 1;
    z-index: 10001;
  }
  .lightbox-close:hover,
  .lightbox-prev:hover,
  .lightbox-next:hover {
    background: var(--gb-mid);
  }
  .lightbox-close {
    top: -40px;
    right: 0;
  }
  .lightbox-prev {
    left: -50px;
    top: 50%;
    transform: translateY(-50%);
  }
  .lightbox-next {
    right: -50px;
    top: 50%;
    transform: translateY(-50%);
  }
  @media (max-width: 600px) {
    .lightbox-prev { left: 0; top: auto; bottom: -50px; transform: none; }
    .lightbox-next { right: 0; top: auto; bottom: -50px; transform: none; }

    #trimPanel .row {
      flex-direction: column;
    }
    .trim-controls {
      min-width: auto;
      width: 100%;
    }
    .preview-col {
      align-items: flex-start;
      max-width: 100%;
      width: 100%;
    }

  }

  footer {
    text-align: center;
    padding: 20px 15px 30px;
    font-size: 9px;
    color: var(--gb-mid);
  }
  footer .footer-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 10px;
  }
  footer a {
    color: var(--gb-dark);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }
  footer a:hover {
    color: var(--gb-mid);
  }
  footer svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* Scanline overlay for retro feel */
  body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    z-index: 9999;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="container">
  <h1>GB Cam Formatter</h1>

  <!-- Upload -->
  <div class="panel">
    <div class="panel-title">1. Upload Images</div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-text" id="dropZoneText">
        <div>DRAG & DROP IMAGES HERE</div>
        <div style="margin-top:8px; font-size:9px;">OR CLICK TO SELECT</div>
      </div>
      <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/jpg">
      <div class="loader-wrap hidden" id="loaderWrap">
        <img class="loader-gif" id="loaderGif" src="loader.gif" alt="Loading">
        <div class="loader-text" id="loaderText">Loading...</div>
      </div>
    </div>
    <div id="uploadStatus" class="status"></div>
    <button class="delete-btn hidden" id="deleteBtn">
      <div class="delete-progress" id="deleteProgress"></div>
      HOLD TO DELETE
    </button>
  </div>

  <!-- Settings -->
  <div class="panel hidden" id="settingsPanel">
    <div class="panel-title">2. Date Range</div>
    <div class="row">
      <div class="col">
        <label>Start Date</label>
        <input type="datetime-local" id="startDate">
      </div>
      <div class="col">
        <label>End Date</label>
        <input type="datetime-local" id="endDate">
      </div>
    </div>
  </div>

  <!-- Border Trim -->
  <div class="panel hidden" id="trimPanel">
    <div class="panel-title">3. Border Trim (Game Boy Dots)</div>
    <div class="row">
      <div class="col trim-controls">
        <div class="field-row">
          <label>Top</label>
          <input type="number" id="trimTop" value="16" min="0">
        </div>
        <div class="field-row">
          <label>Bottom</label>
          <input type="number" id="trimBottom" value="16" min="0">
        </div>
        <div class="field-row">
          <label>Left</label>
          <input type="number" id="trimLeft" value="16" min="0">
        </div>
        <div class="field-row">
          <label>Right</label>
          <input type="number" id="trimRight" value="16" min="0">
        </div>
        <div class="field-row">
          <label>Scale</label>
          <input type="number" id="scaleFactor" value="1" min="1" step="1">
          <span style="font-size:8px;">dots/px</span>
        </div>
      </div>
      <div class="preview-col">
        <div class="preview-box" id="previewBox">
          <canvas id="previewCanvas"></canvas>
        </div>
        <div class="status" id="previewStatus">Preview on first image</div>
      </div>
    </div>
  </div>

  <!-- Gallery -->
  <div class="panel hidden" id="galleryPanel">
    <div class="panel-title panel-title-toggle collapsed" id="galleryToggle">4. Gallery Preview</div>
    <div class="teaser-row hidden" id="galleryTeaser"></div>
    <div class="image-list hidden" id="imageList"></div>
  </div>

  <!-- Actions -->
  <div class="panel hidden" id="actionsPanel">
    <div class="panel-title">5. Process</div>
    <div class="center-actions">
      <button class="btn" id="processBtn">Generate & Download ZIP</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="processStatus" class="status"></div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="#" id="githubLink" title="GitHub">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      <span>GitHub</span>
    </a>
    <a href="#" id="xLink" title="X / Twitter">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span>X</span>
    </a>
  </div>
  <div>Made with <span style="color:#e25555;">&#9829;</span> for all the Game Boy Camera enthusiasts</div>
</footer>

<!-- Lightbox -->
<div class="lightbox-overlay hidden" id="lightboxOverlay">
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightboxClose" title="Close">X</button>
    <button class="lightbox-prev" id="lightboxPrev" title="Previous">&lt;</button>
    <img id="lightboxImg" src="" alt="Preview">
    <button class="lightbox-next" id="lightboxNext" title="Next">&gt;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // DOM refs
  const dropZone = document.getElementById('dropZone');
  const dropZoneText = document.getElementById('dropZoneText');
  const fileInput = document.getElementById('fileInput');
  const uploadStatus = document.getElementById('uploadStatus');
  const loaderWrap = document.getElementById('loaderWrap');
  const loaderGif = document.getElementById('loaderGif');
  const loaderText = document.getElementById('loaderText');
  const deleteBtn = document.getElementById('deleteBtn');
  const deleteProgress = document.getElementById('deleteProgress');
  const settingsPanel = document.getElementById('settingsPanel');
  const trimPanel = document.getElementById('trimPanel');
  const galleryPanel = document.getElementById('galleryPanel');
  const actionsPanel = document.getElementById('actionsPanel');
  const startDateInput = document.getElementById('startDate');
  const endDateInput = document.getElementById('endDate');
  const trimTop = document.getElementById('trimTop');
  const trimBottom = document.getElementById('trimBottom');
  const trimLeft = document.getElementById('trimLeft');
  const trimRight = document.getElementById('trimRight');
  const scaleFactor = document.getElementById('scaleFactor');
  const previewCanvas = document.getElementById('previewCanvas');
  const previewStatus = document.getElementById('previewStatus');
  const imageList = document.getElementById('imageList');
  const galleryTeaser = document.getElementById('galleryTeaser');
  const galleryToggle = document.getElementById('galleryToggle');
  const lightboxOverlay = document.getElementById('lightboxOverlay');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  const processBtn = document.getElementById('processBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const processStatus = document.getElementById('processStatus');

  const previewCtx = previewCanvas.getContext('2d');

  let filesData = []; // { file, number, img, date }
  let firstImage = null;
  let firstImageNaturalWidth = 0;
  let firstImageNaturalHeight = 0;
  let lightboxIndex = 0;

  const loadingPhrases = [
    'Developing photos...',
    'Reading cartridges...',
    'Winding film...',
    'Loading Game Pak...',
    'Pixelating memories...',
    'Connecting to Printer...',
    'Inserting cartridge...',
    'Waking up Pikachu...',
    'Blowing dust off pins...',
    'Tightening screws...',
  ];

  function pickLoadingPhrase() {
    return loadingPhrases[Math.floor(Math.random() * loadingPhrases.length)];
  }

  // Load persisted settings
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('gbcam_settings') || '{}');
      if (s.startDate) startDateInput.value = s.startDate;
      if (s.endDate) endDateInput.value = s.endDate;
      if (s.trimTop !== undefined) trimTop.value = s.trimTop;
      if (s.trimBottom !== undefined) trimBottom.value = s.trimBottom;
      if (s.trimLeft !== undefined) trimLeft.value = s.trimLeft;
      if (s.trimRight !== undefined) trimRight.value = s.trimRight;
      if (s.scaleFactor !== undefined) scaleFactor.value = s.scaleFactor;
    } catch(e) {}
  }
  function saveSettings() {
    localStorage.setItem('gbcam_settings', JSON.stringify({
      startDate: startDateInput.value,
      endDate: endDateInput.value,
      trimTop: trimTop.value,
      trimBottom: trimBottom.value,
      trimLeft: trimLeft.value,
      trimRight: trimRight.value,
      scaleFactor: scaleFactor.value,
    }));
  }
  loadSettings();

  // Gallery toggle
  function toggleGallery() {
    const isCollapsed = imageList.classList.toggle('hidden');
    galleryTeaser.classList.toggle('hidden', !isCollapsed);
    galleryToggle.classList.toggle('collapsed', isCollapsed);
    localStorage.setItem('gbcam_gallery_collapsed', isCollapsed ? '1' : '0');
  }
  galleryToggle.addEventListener('click', toggleGallery);

  // Restore gallery collapsed state
  try {
    if (localStorage.getItem('gbcam_gallery_collapsed') !== '0') {
      imageList.classList.add('hidden');
      galleryTeaser.classList.remove('hidden');
      galleryToggle.classList.add('collapsed');
    } else {
      galleryTeaser.classList.add('hidden');
    }
  } catch(e) {
    galleryTeaser.classList.add('hidden');
  }

  // Set default dates if empty
  function setDefaultDates() {
    if (!startDateInput.value) {
      const now = new Date();
      now.setMinutes(0, 0, 0);
      startDateInput.value = toDatetimeLocal(now);
    }
    if (!endDateInput.value) {
      const end = new Date();
      end.setDate(end.getDate() + 1);
      end.setMinutes(0, 0, 0);
      endDateInput.value = toDatetimeLocal(end);
    }
  }
  function toDatetimeLocal(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Drag & drop
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => /image\/(png|jpeg|jpg)/i.test(f.type));
    if (!files.length) return;

    // Extract numbers from filenames like 000283.png -> 283
    const parsed = files.map(file => {
      const match = file.name.match(/(\d+)/);
      const num = match ? parseInt(match[1], 10) : 0;
      return { file, number: num };
    }).filter(item => item.number > 0);

    if (!parsed.length) {
      uploadStatus.textContent = 'No images with numeric names found.';
      return;
    }

    const isAppend = filesData.length > 0;
    const addedCount = parsed.length;

    // Merge: replace duplicates by filename, then add new ones
    const existingMap = new Map(filesData.map(item => [item.file.name, item]));
    parsed.forEach(item => {
      existingMap.set(item.file.name, item);
    });
    filesData = Array.from(existingMap.values());
    filesData.sort((a, b) => a.number - b.number);

    uploadStatus.textContent = `Loading ${addedCount} image(s)...`;
    loaderText.textContent = pickLoadingPhrase();
    dropZoneText.classList.add('hidden');
    loaderWrap.classList.remove('hidden');

    // Only preload newly added files (those without cachedImg)
    const preloadPromises = filesData
      .filter(item => !item.cachedImg)
      .map(item => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            item.cachedImg = img;
            item.naturalWidth = img.naturalWidth;
            item.naturalHeight = img.naturalHeight;
            resolve();
          };
          img.onerror = () => resolve();
          img.src = e.target.result;
        };
        reader.onerror = () => resolve();
        reader.readAsDataURL(item.file);
      }));

    Promise.all(preloadPromises).then(() => {
      loaderWrap.classList.add('hidden');
      dropZoneText.classList.remove('hidden');
      if (isAppend) {
        uploadStatus.textContent = `Added ${addedCount}. Total: ${filesData.length}. Range: ${filesData[0].number} - ${filesData[filesData.length-1].number}`;
      } else {
        uploadStatus.textContent = `${filesData.length} image(s) loaded. Range: ${filesData[0].number} - ${filesData[filesData.length-1].number}`;
      }

      deleteBtn.classList.remove('hidden');
      settingsPanel.classList.remove('hidden');
      trimPanel.classList.remove('hidden');
      galleryPanel.classList.remove('hidden');
      actionsPanel.classList.remove('hidden');

      setDefaultDates();
      updateDates();
      loadFirstImage();
      renderGallery();
      saveSettings();
    });
  }

  function updateDates() {
    const startVal = startDateInput.value;
    const endVal = endDateInput.value;
    if (!startVal || !endVal || !filesData.length) return;

    const startDate = new Date(startVal);
    const endDate = new Date(endVal);
    const minNum = filesData[0].number;
    const maxNum = filesData[filesData.length - 1].number;
    const range = maxNum - minNum || 1;
    const timeRange = endDate.getTime() - startDate.getTime();

    filesData.forEach(item => {
      const ratio = (item.number - minNum) / range;
      item.date = new Date(startDate.getTime() + ratio * timeRange);
    });

    renderGallery();
  }

  [startDateInput, endDateInput].forEach(el => el.addEventListener('change', () => { updateDates(); saveSettings(); }));

  // Load first image for preview
  function loadFirstImage() {
    if (!filesData.length) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        firstImage = img;
        firstImageNaturalWidth = img.naturalWidth;
        firstImageNaturalHeight = img.naturalHeight;
        autoDetectScale();
        drawPreview();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(filesData[0].file);
  }

  // Auto detect scale based on image dimensions
  function autoDetectScale() {
    if (!firstImageNaturalWidth || !firstImageNaturalHeight) return;
    const w = firstImageNaturalWidth;
    let detected = 1;

    // Game Boy Printer strip width is 160 dots
    // Game Boy Camera photo width is 128 dots
    if (w % 160 === 0 && w / 160 >= 1) {
      detected = w / 160;
    } else if (w % 128 === 0 && w / 128 >= 1) {
      detected = w / 128;
    } else {
      // Heuristic: pick nearest reasonable scale
      const scales = [1, 2, 3, 4, 5, 6, 8, 10];
      let best = 1;
      let bestDiff = Infinity;
      for (const s of scales) {
        const diff = Math.abs(w / s - 160);
        if (diff < bestDiff) { bestDiff = diff; best = s; }
      }
      detected = best;
    }

    scaleFactor.value = Math.round(detected);
    saveSettings();
    drawPreview();
  }



  function getTrimPixels() {
    const s = parseInt(scaleFactor.value, 10) || 1;
    return {
      top: (parseInt(trimTop.value, 10) || 0) * s,
      bottom: (parseInt(trimBottom.value, 10) || 0) * s,
      left: (parseInt(trimLeft.value, 10) || 0) * s,
      right: (parseInt(trimRight.value, 10) || 0) * s,
    };
  }

  function drawPreview() {
    if (!firstImage) return;
    const trim = getTrimPixels();
    const w = firstImageNaturalWidth;
    const h = firstImageNaturalHeight;

    // Draw original in canvas (scaled down to fit)
    const maxPreviewWidth = 300;
    const previewScale = Math.min(1, maxPreviewWidth / w);
    const canvasW = Math.floor(w * previewScale);
    const canvasH = Math.floor(h * previewScale);

    previewCanvas.width = canvasW;
    previewCanvas.height = canvasH;
    previewCtx.clearRect(0, 0, canvasW, canvasH);
    previewCtx.imageSmoothingEnabled = false;
    previewCtx.drawImage(firstImage, 0, 0, canvasW, canvasH);

    // Draw crop overlay directly on canvas (pixel-perfect alignment)
    const t = trim.top * previewScale;
    const b = trim.bottom * previewScale;
    const l = trim.left * previewScale;
    const r = trim.right * previewScale;

    previewCtx.fillStyle = 'rgba(139, 172, 15, 0.25)';
    // Top strip
    previewCtx.fillRect(0, 0, canvasW, t);
    // Bottom strip
    previewCtx.fillRect(0, canvasH - b, canvasW, b);
    // Left strip
    previewCtx.fillRect(0, t, l, canvasH - t - b);
    // Right strip
    previewCtx.fillRect(canvasW - r, t, r, canvasH - t - b);

    // Dashed border on the crop edges
    previewCtx.strokeStyle = 'rgba(155, 188, 15, 0.8)';
    previewCtx.lineWidth = 2;
    previewCtx.setLineDash([4, 4]);
    previewCtx.strokeRect(l, t, canvasW - l - r, canvasH - t - b);
    previewCtx.setLineDash([]);

    const cw = canvasW - l - r;
    const ch = canvasH - t - b;
    previewStatus.textContent = `Preview: ${w}x${h} → crop ${cw/previewScale|0}x${ch/previewScale|0} (scale ${scaleFactor.value}x)`;
  }

  [trimTop, trimBottom, trimLeft, trimRight, scaleFactor].forEach(el => {
    el.addEventListener('input', () => { drawPreview(); saveSettings(); });
    el.addEventListener('change', () => { renderGallery(); });
  });

  function createThumb(item, idx, small) {
    const div = document.createElement('div');
    div.className = 'thumb';

    const img = document.createElement('img');

    // Draw cropped thumbnail from cached image
    if (item.cachedImg) {
      const trim = getTrimPixels();
      const w = item.cachedImg.naturalWidth;
      const h = item.cachedImg.naturalHeight;
      const cw = Math.max(1, w - trim.left - trim.right);
      const ch = Math.max(1, h - trim.top - trim.bottom);

      const c = document.createElement('canvas');
      c.width = cw;
      c.height = ch;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(item.cachedImg, -trim.left, -trim.top);

      img.src = c.toDataURL('image/png');
    }

    div.appendChild(img);

    if (!small) {
      const name = document.createElement('div');
      name.textContent = item.file.name;

      const dateDiv = document.createElement('div');
      if (item.date) {
        const pad = n => String(n).padStart(2, '0');
        const d = item.date;
        dateDiv.textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } else {
        dateDiv.textContent = '...';
      }
      dateDiv.style.opacity = '0.7';

      div.appendChild(name);
      div.appendChild(dateDiv);
    }

    div.addEventListener('click', () => openLightbox(idx));
    return div;
  }

  function renderGallery() {
    imageList.innerHTML = '';
    galleryTeaser.innerHTML = '';

    // Full grid
    filesData.forEach((item, idx) => {
      imageList.appendChild(createThumb(item, idx, false));
    });

    // Teaser row (first 3 images + show-all button below)
    const thumbsWrap = document.createElement('div');
    thumbsWrap.className = 'teaser-thumbs';

    const teaserCount = Math.min(3, filesData.length);
    for (let i = 0; i < teaserCount; i++) {
      thumbsWrap.appendChild(createThumb(filesData[i], i, true));
    }
    galleryTeaser.appendChild(thumbsWrap);

    const btn = document.createElement('button');
    btn.className = 'show-all-btn';
    btn.textContent = filesData.length > teaserCount
      ? `[+] Show all ${filesData.length} images`
      : `[+] Expand gallery`;
    btn.addEventListener('click', () => {
      imageList.classList.remove('hidden');
      galleryTeaser.classList.add('hidden');
      galleryToggle.classList.remove('collapsed');
      localStorage.setItem('gbcam_gallery_collapsed', '0');
    });
    galleryTeaser.appendChild(btn);
  }

  // Lightbox
  function openLightbox(idx) {
    lightboxIndex = idx;
    updateLightbox();
    lightboxOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightboxOverlay.classList.add('hidden');
    document.body.style.overflow = '';
  }

  function showPrev() {
    if (filesData.length === 0) return;
    lightboxIndex = (lightboxIndex - 1 + filesData.length) % filesData.length;
    updateLightbox();
  }

  function showNext() {
    if (filesData.length === 0) return;
    lightboxIndex = (lightboxIndex + 1) % filesData.length;
    updateLightbox();
  }

  function updateLightbox() {
    const item = filesData[lightboxIndex];
    if (!item) return;

    // Show cropped image in lightbox
    if (item.cachedImg) {
      const trim = getTrimPixels();
      const w = item.cachedImg.naturalWidth;
      const h = item.cachedImg.naturalHeight;
      const cw = Math.max(1, w - trim.left - trim.right);
      const ch = Math.max(1, h - trim.top - trim.bottom);

      const c = document.createElement('canvas');
      c.width = cw;
      c.height = ch;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(item.cachedImg, -trim.left, -trim.top);
      lightboxImg.src = c.toDataURL('image/png');
    }

    const pad = n => String(n).padStart(2, '0');
    const d = item.date;
    const dateStr = d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '...';
    lightboxCaption.textContent = `${lightboxIndex + 1} / ${filesData.length} — ${item.file.name} — ${dateStr}`;
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', e => { e.stopPropagation(); showPrev(); });
  lightboxNext.addEventListener('click', e => { e.stopPropagation(); showNext(); });
  lightboxOverlay.addEventListener('click', e => {
    if (e.target === lightboxOverlay) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (lightboxOverlay.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'ArrowRight') showNext();
  });

  // Process images
  processBtn.addEventListener('click', async () => {
    if (!filesData.length) return;
    processBtn.disabled = true;
    progressWrap.style.display = 'block';
    processStatus.textContent = 'Processing...';

    const zip = new JSZip();
    const total = filesData.length;
    const trim = getTrimPixels();

    for (let i = 0; i < total; i++) {
      const item = filesData[i];
      const file = item.file;
      const date = item.date;

      progressBar.style.width = `${((i) / total) * 100}%`;
      processStatus.textContent = `Processing ${i+1}/${total}: ${file.name}`;

      try {
        const result = await processImage(file, date, trim);
        const outName = generateOutputName(date);
        zip.file(outName, result, { base64: false });
      } catch (err) {
        console.error('Error processing', file.name, err);
      }

      // Small delay to let UI update
      await new Promise(r => setTimeout(r, 10));
    }

    progressBar.style.width = '100%';
    processStatus.textContent = 'Creating ZIP...';

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gb_cam_photos.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
    processStatus.textContent = `Done! ${total} image(s) processed.`;
    processBtn.disabled = false;
  });

  function generateOutputName(date) {
    const pad = n => String(n).padStart(2, '0');
    return `GB_Camera_${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}.jpg`;
  }

  // Hold-to-delete logic
  let deleteTimer = null;
  let deleteStartTime = null;
  const DELETE_HOLD_MS = 2000;

  function clearAllImages() {
    filesData = [];
    firstImage = null;
    firstImageNaturalWidth = 0;
    firstImageNaturalHeight = 0;
    imageList.innerHTML = '';
    galleryTeaser.innerHTML = '';
    uploadStatus.textContent = '';
    deleteBtn.classList.add('hidden');
    settingsPanel.classList.add('hidden');
    trimPanel.classList.add('hidden');
    galleryPanel.classList.add('hidden');
    actionsPanel.classList.add('hidden');
    previewCanvas.width = 0;
    previewCanvas.height = 0;
    previewStatus.textContent = 'Preview on first image';
    fileInput.value = '';
    dropZoneText.classList.remove('hidden');
    loaderWrap.classList.add('hidden');
  }

  function startDeleteHold() {
    if (deleteTimer) return;
    deleteBtn.classList.add('active');
    deleteStartTime = Date.now();
    deleteTimer = setInterval(() => {
      const elapsed = Date.now() - deleteStartTime;
      const pct = Math.min(100, (elapsed / DELETE_HOLD_MS) * 100);
      deleteProgress.style.width = pct + '%';
      if (elapsed >= DELETE_HOLD_MS) {
        stopDeleteHold();
        clearAllImages();
      }
    }, 50);
  }

  function stopDeleteHold() {
    if (deleteTimer) {
      clearInterval(deleteTimer);
      deleteTimer = null;
    }
    deleteBtn.classList.remove('active');
    deleteProgress.style.width = '0%';
  }

  deleteBtn.addEventListener('mousedown', startDeleteHold);
  deleteBtn.addEventListener('mouseup', stopDeleteHold);
  deleteBtn.addEventListener('mouseleave', stopDeleteHold);
  deleteBtn.addEventListener('touchstart', e => { e.preventDefault(); startDeleteHold(); });
  deleteBtn.addEventListener('touchend', stopDeleteHold);

  // Prevent accidental page reload when images are loaded
  window.addEventListener('beforeunload', e => {
    if (filesData.length > 0) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function processImage(file, date, trim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            const cw = Math.max(1, w - trim.left - trim.right);
            const ch = Math.max(1, h - trim.top - trim.bottom);

            const canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, -trim.left, -trim.top);

            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);

            // Inject EXIF DateTimeOriginal
            let exifObj = {};
            try {
              exifObj = piexif.load(dataUrl);
            } catch (e) {
              exifObj = { '0th': {}, 'Exif': {}, 'GPS': {}, '1st': {}, 'thumbnail': null };
            }

            const pad = n => String(n).padStart(2, '0');
            const d = date;
            const dateStr = `${d.getFullYear()}:${pad(d.getMonth()+1)}:${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

            exifObj['Exif'][piexif.ExifIFD.DateTimeOriginal] = dateStr;
            exifObj['Exif'][piexif.ExifIFD.DateTimeDigitized] = dateStr;
            exifObj['0th'][piexif.ImageIFD.DateTime] = dateStr;

            const exifBytes = piexif.dump(exifObj);
            const newDataUrl = piexif.insert(exifBytes, dataUrl);

            // Convert to blob
            const base64 = newDataUrl.split(',')[1];
            const byteChars = atob(base64);
            const byteNums = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
              byteNums[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNums);
            resolve(byteArray);
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
})();
</script>

</body>
</html>
